name: Switching Core Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test without NVIDIA hardware
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: changes
        shell: powershell
        run: |
          $runHeavy = $true
          $eventName = '${{ github.event_name }}'

          if ($eventName -eq 'pull_request') {
            $baseRef = '${{ github.base_ref }}'
            $files = @(git diff --name-only "origin/$baseRef...HEAD")
          }
          elseif ($eventName -eq 'push') {
            $before = '${{ github.event.before }}'
            if ($before -and $before -notmatch '^0+$') {
              $files = @(git diff --name-only $before '${{ github.sha }}')
            }
            else {
              $files = @()
            }
          }
          else {
            $files = @()
          }

          if ($files.Count -gt 0) {
            $nonDocumentationFiles = @($files | Where-Object {
              $_ -notmatch '\.md$' -and $_ -notmatch '(^|/)docs/'
            })
            $runHeavy = $nonDocumentationFiles.Count -gt 0
          }

          "run_heavy=$($runHeavy.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Changed files: $($files -join ', ')"
          Write-Host "Run switching core tests: $runHeavy"

      - name: Build and run switching core tests
        if: steps.changes.outputs.run_heavy == 'true'
        shell: cmd
        working-directory: NvProfileSwitcher
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio with C++ tools was not found.
            exit /b 1
          )
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /W4 /EHsc /MT /DNOMINMAX tests\switching_core_tests.cpp tests\hotkey_core_tests.cpp switching_core.cpp hotkey_core.cpp /Fe:switching_core_tests.exe
          if errorlevel 1 exit /b %errorlevel%
          switching_core_tests.exe
          if errorlevel 1 exit /b %errorlevel%

      - name: Documentation-only validation
        if: steps.changes.outputs.run_heavy != 'true'
        shell: powershell
        run: Write-Host 'Documentation-only change detected; switching core tests skipped.'
