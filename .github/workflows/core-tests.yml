name: Switching Core Tests

on:
  push:
    branches:
      - 'refactor/**'
      - 'feature/**'
      - 'style/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test without NVIDIA hardware
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and run switching core tests
        shell: cmd
        working-directory: NvProfileSwitcher
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio with C++ tools was not found.
            exit /b 1
          )
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /W4 /EHsc /MT /DNOMINMAX tests\switching_core_tests.cpp switching_core.cpp /Fe:switching_core_tests.exe
          if errorlevel 1 exit /b %errorlevel%
          switching_core_tests.exe
          if errorlevel 1 exit /b %errorlevel%
