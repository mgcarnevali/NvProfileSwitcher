name: Build NvProfileSwitcher Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native x64
        shell: cmd
        working-directory: NvProfileSwitcher
        run: |
          rc /nologo app.rc
          cl /nologo /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE /DNOMINMAX main.cpp app.res /Fe:NvProfileSwitcher.exe /link /SUBSYSTEM:WINDOWS /MACHINE:X64

      - name: Show binary size
        shell: powershell
        run: |
          Get-Item .\NvProfileSwitcher\NvProfileSwitcher.exe | Select-Object Name,Length

      - name: Create portable ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path .\NvProfileSwitcher\NvProfileSwitcher.exe `
            -DestinationPath .\NvProfileSwitcher.zip `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NvProfileSwitcher
          path: .\NvProfileSwitcher.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .\NvProfileSwitcher.zip
