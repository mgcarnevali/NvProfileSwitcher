name: Build GameProfileSwitcher Native

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native x64
        shell: cmd
        working-directory: GameProfileSwitcher
        run: |
          rc /nologo app.rc
          cl /nologo /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE main.cpp app.res /Fe:GameProfileSwitcher.exe /link /SUBSYSTEM:WINDOWS /MACHINE:X64

      - name: Show binary size
        shell: powershell
        run: |
          Get-Item .\GameProfileSwitcher\GameProfileSwitcher.exe | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameProfileSwitcher-native-win-x64
          path: .\GameProfileSwitcher\GameProfileSwitcher.exe
