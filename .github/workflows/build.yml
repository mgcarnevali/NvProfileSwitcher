name: Build GameProfileSwitcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\GameProfileSwitcher\GameProfileSwitcher.csproj

      - name: Publish
        run: >
          dotnet publish .\GameProfileSwitcher\GameProfileSwitcher.csproj
          -c Release
          -r win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameProfileSwitcher-win-x64
          path: .\publish\GameProfileSwitcher.exe
