name: Build NvProfileSwitcher Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native x64
        shell: cmd
        working-directory: NvProfileSwitcher
        run: |
          rc /nologo app.rc
          cl /nologo /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE /DNOMINMAX main.cpp app.res /Fe:NvProfileSwitcher.exe /link /SUBSYSTEM:WINDOWS /MACHINE:X64

      - name: Show binary size
        shell: powershell
        run: |
          Get-Item .\NvProfileSwitcher\NvProfileSwitcher.exe |
            Select-Object Name,Length

      - name: Create portable folder
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Path .\Release\NvProfileSwitcher `
            -Force | Out-Null

          Copy-Item `
            .\NvProfileSwitcher\NvProfileSwitcher.exe `
            .\Release\NvProfileSwitcher\NvProfileSwitcher.exe

      # GitHub automatically packages this folder as an artifact ZIP.
      # Upload Release instead of Release\NvProfileSwitcher so the
      # NvProfileSwitcher folder itself is preserved inside the ZIP.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NvProfileSwitcher
          path: .\Release
          if-no-files-found: error

      # Only tags/releases need our own versioned ZIP.
      - name: Create versioned ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "NvProfileSwitcher-$version.zip"

          Compress-Archive `
            -Path .\Release\NvProfileSwitcher `
            -DestinationPath ".\$zipName" `
            -Force

          "ZIP_NAME=$zipName" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .\${{ env.ZIP_NAME }}
