name: Build NvProfileSwitcher Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate build version
        shell: powershell
        run: |
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/v")

          if ($isTag) {
            $tag = "${{ github.ref_name }}"

            if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH format. Got: $tag"
            }

            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3]

            $version = "$major.$minor.$patch"
            $fileVersion = "$major,$minor,$patch,0"
            $devBuild = 0

            $artifactName = "NvProfileSwitcher-$tag"
          }
          else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)

            $version = "dev-$shortSha"
            $fileVersion = "0,0,0,0"
            $devBuild = 1

            $artifactName = "NvProfileSwitcher-$version"
          }

          $header = @"
          #pragma once
          #define NVPS_VERSION_FILE $fileVersion
          #define NVPS_VERSION_STR "$version"
          #define NVPS_VERSION_WSTR L"$version"
          #define NVPS_DEV_BUILD $devBuild
          "@

          Set-Content `
            -Path .\NvProfileSwitcher\version.h `
            -Value $header `
            -Encoding ascii

          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
          "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_ENV

          Write-Host "NvProfileSwitcher build version: $version"
          Write-Host "Artifact name: $artifactName"

      - name: Build native x64
        shell: cmd
        working-directory: NvProfileSwitcher
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio with C++ tools was not found.
            exit /b 1
          )
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b %errorlevel%
          rc /nologo app.rc
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /O2 /EHsc /MT /DUNICODE /D_UNICODE /DNOMINMAX main.cpp app.res /Fe:NvProfileSwitcher.exe /link /SUBSYSTEM:WINDOWS /MACHINE:X64
          if errorlevel 1 exit /b %errorlevel%

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        working-directory: NvProfileSwitcher
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ env.BUILD_VERSION }}" `
            "installer\NvProfileSwitcher.iss"

      - name: Show binary size
        shell: powershell
        run: |
          Get-Item .\NvProfileSwitcher\NvProfileSwitcher.exe |
            Select-Object Name,Length

          Get-Item .\NvProfileSwitcher\installer\output\*.exe |
            Select-Object Name,Length

      - name: Create portable folder
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Path .\Release\NvProfileSwitcher `
            -Force | Out-Null

          Copy-Item `
            .\NvProfileSwitcher\NvProfileSwitcher.exe `
            .\Release\NvProfileSwitcher\NvProfileSwitcher.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .\Release
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: NvProfileSwitcher-Setup-${{ env.BUILD_VERSION }}
          path: .\NvProfileSwitcher\installer\output\*.exe
          if-no-files-found: error

      - name: Create Release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          Compress-Archive `
            -Path .\Release\NvProfileSwitcher `
            -DestinationPath ".\${{ env.ARTIFACT_NAME }}.zip" `
            -Force

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .\${{ env.ARTIFACT_NAME }}.zip
            .\NvProfileSwitcher\installer\output\NvProfileSwitcher-Setup-v${{ env.BUILD_VERSION }}.exe
